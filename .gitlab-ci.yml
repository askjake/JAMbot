include:
  - local: 'templates/.buildpush.yml'
  - local: 'templates/.update_img_tag.yml'


default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker info
    - apk add --no-cache curl jq python3 py3-pip aws-cli
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - aws --version


# GITLAB_PAT must be provided as a masked/protected GitLab CI variable.

stages:
 - build:dev
 - deploy:dev
 - build:prod

