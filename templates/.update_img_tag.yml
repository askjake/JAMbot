.update_img_tag:
  image: alpine
  variables:
    CI_USERNAME: gitlabci-deno
    CI_PUSH_TOKEN: $GITLAB_PAT
    CI_REPO: gitlab.com/dish-cloud/dt/sse/datasolutions/ds-argocd-apps.git
    CI_BRANCH: main
    IMG_TAG: v1
    ENV: staging
    PROJ_PATH: "a/b/c"
  before_script:
    - apk add --no-cache git curl bash
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
    - mv kustomize /usr/local/bin/
    - git clone https://${CI_USERNAME}:${CI_PUSH_TOKEN}@${CI_REPO} 
    - cd ds-argocd-apps
    - git config --global user.email "david.fox@dish.com"
    - git config --global user.name "GitLab CI/CD"
    - git remote -v
  script:
    - pwd
    - cd ${PROJ_PATH}
    - echo BEFORE...
    - cat kustomization.yaml
    - echo AFTER...
    - kustomize edit set image $CI_REGISTRY_IMAGE:$IMG_TAG
    - cat kustomization.yaml
    - git commit -am "Upgraded image $CI_REGISTRY_IMAGE with the tag $IMG_TAG"
    - git push origin main