  /chats-groups:
    post:
      summary: Create new chat group
      description: Create a new chat group for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Title of the chat group
                  example: "Work Projects"
      responses:
        '200':
          description: Chat group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGroup'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [GROUP_LIMIT_EXCEEDED]
                    example: GROUP_LIMIT_EXCEEDED
                  message:
                    type: string
                    example: "Chat group limit reached. You can have up to 20 groups. Please delete some existing groups to create new ones."
        '401':
          description: Unauthorized

    get:
      summary: List chat groups
      description: List all chat groups owned by the user with pagination and search support
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of groups per page
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
            default: ""
          description: Search term to filter groups by title
      responses:
        '200':
          description: List of chat groups with pagination
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatGroup'
        '401':
          description: Unauthorized

  /chats-groups/{groupId}:
    put:
      summary: Update chat group
      description: Update the title of an existing chat group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: UUID of the chat group to update
          example: "e4adfbe1-42d3-4a34-9b3d-fb7d0d049987"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: New title for the chat group
                  example: "Updated Work Projects"
      responses:
        '200':
          description: Chat group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGroup'
        '400':
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Not authorized to modify this group
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Not authorized to modify this group"
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Group not found"

    delete:
      summary: Delete chat group
      description: Delete an existing chat group. Only the owner can delete the group.
      tags:
        - chat_group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: UUID of the chat group to delete
          example: "e4adfbe1-42d3-4a34-9b3d-fb7d0d049987"
      responses:
        '200':
          description: Chat group deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id:
                    type: string
                    description: UUID of the deleted group
                    example: "e4adfbe1-42d3-4a34-9b3d-fb7d0d049987"
        '401':
          description: Unauthorized
        '403':
          description: Not authorized to delete this group
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Not authorized to delete this group"
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Group not found"
  /releases:
    get:
      tags:
        - releases
      summary: List all releases
      description: |
        Retrieve a paginated list of all releases with optional filtering by title search and date.
        Supports case-insensitive title search and exact date filtering.
      operationId: listReleases
      parameters:
        - name: page
          in: query
          description: Page number for pagination (starts from 1)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 10
        - name: search
          in: query
          description: Search term to filter releases by title (case-insensitive)
          required: false
          schema:
            type: string
            maxLength: 40
            default: ""
          example: "version 2.0"
        - name: date
          in: query
          description: Filter releases by specific date (ISO 8601 format)
          required: false
          schema:
            type: string
            format: date-time
          example: "2023-12-25T10:00:00Z"
      responses:
        '200':
          description: Successfully retrieved releases list
          content:
            application/json:
              schema:
                type: object
                required:
                  - docs
                  - totalDocs
                  - limit
                  - page
                  - totalPages
                  - hasNextPage
                  - hasPrevPage
                properties:
                  docs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Release'
                    description: Array of release objects for the current page
                  totalDocs:
                    type: integer
                    description: Total number of releases matching the filter criteria
                    example: 25
                  limit:
                    type: integer
                    description: Number of items per page
                    example: 10
                  page:
                    type: integer
                    description: Current page number
                    example: 1
                  totalPages:
                    type: integer
                    description: Total number of pages
                    example: 3
                  hasNextPage:
                    type: boolean
                    description: Whether there is a next page available
                    example: true
                  nextPage:
                    type: integer
                    nullable: true
                    description: Next page number (null if no next page)
                    example: 2
                  hasPrevPage:
                    type: boolean
                    description: Whether there is a previous page available
                    example: false
                  prevPage:
                    type: integer
                    nullable: true
                    description: Previous page number (null if no previous page)
                    example: null
        '400':
          description: Bad request - Invalid query parameters
        '422':
          description: Validation error

    put:
      tags:
        - releases
      summary: Update user's last release date
      description: |
        Update the last release date for the authenticated user. This is typically used 
        to track when a user last viewed release notes or acknowledged releases.
      operationId: updateLastReleaseDate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
              properties:
                date:
                  type: string
                  format: date-time
                  description: The date to set as last viewed release date
                  example: "2023-12-25T10:00:00Z"
            example:
              date: "2023-12-25T10:00:00Z"
      responses:
        '200':
          description: Successfully updated last release date
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: string
                    description: Success message confirming the update
                    example: "The date has been updated."
              example:
                ok: "The date has been updated."
        '400':
          description: Bad request - Invalid date format
        '401':
          description: Unauthorized - Missing or invalid user email
        '422':
          description: Validation error
        '500':
          description: Internal server error

  /releases/last:
    get:
      tags:
        - releases
      summary: Get the latest release
      description: |
        Retrieve the most recent release based on the release date. 
        Returns the release with the latest date value.
      operationId: getLastRelease
      responses:
        '200':
          description: Successfully retrieved the latest release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
              example:
                release_id: "123e4567-e89b-12d3-a456-426614174000"
                title: "Version 2.1.0 - Major Update"
                date: "2023-12-25T10:00:00Z"
                changes:
                  - "Added new user authentication system"
                  - "Fixed critical security vulnerability"
                  - "Improved application performance by 30%"
                  - "Updated user interface design"
                created_at: "2023-12-20T09:00:00Z"
                updated_at: "2023-12-22T14:30:00Z"
        '404':
          description: No releases found
        '500':
          description: Internal server error